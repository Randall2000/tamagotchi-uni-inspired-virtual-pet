name: Verify pet MVP
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: tar -czf tamagotchi-uni-inspired-virtual-pet-${{ github.sha }}.tar.gz index.html app.js motion.js navigation.js pet.js styles.css server.mjs package.json README.md public/assets scripts tests
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-web-mvp
          path: tamagotchi-uni-inspired-virtual-pet-${{ github.sha }}.tar.gz
