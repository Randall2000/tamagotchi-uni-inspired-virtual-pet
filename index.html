<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee7dc"><title>MOMO · 口袋電子寵物</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app-shell">
<header><span class="eyebrow">POCKET COMPANION</span><h1>和 MOMO 的小日子</h1><p>三顆按鍵，一起慢慢生活。</p></header>
<section class="device" aria-label="MOMO 電子寵物">
<div class="brand">MOMO <span>•</span> POCKET PET</div>
<div class="bezel"><div class="screen" id="screen">
<div class="screen-top"><span id="pet-age">第 1 天</span><span id="clock">--:--</span><span class="save-dot" aria-label="存檔狀態"></span></div>
<div class="scene" id="room-scene"><img class="room-art" src="/public/assets/momo-room.png" alt="MOMO 的像素房間"><img id="pet-sprite" class="pixel-pet" src="/public/assets/momo-cat-pixel.png" alt="MOMO 坐著待機"><div id="pet-atlas" role="img" hidden></div><span id="pose-caption">陪著你</span></div>
<div id="device-menu" hidden><div class="menu-heading"><strong id="menu-title"></strong><span id="menu-count"></span></div><ul id="menu-items" aria-label="按 A 選擇，B 確認"></ul><div id="detail-content"></div><div class="screen-hint">A 選擇　B 確認　C 返回</div></div>
<div class="screen-bottom" id="screen-message" role="status" aria-live="polite">A 選單 · B 選單</div>
</div></div>
<div class="device-model">COLOR · 240</div>
<section class="controls" aria-label="電子雞三鍵操作"><div><button type="button" data-control="a" aria-label="A 選擇下一項">A</button><span>選擇</span></div><div><button type="button" data-control="b" aria-label="B 確認">B</button><span>確認</span></div><div><button type="button" data-control="c" aria-label="C 返回">C</button><span>返回</span></div></section>
<div class="speaker" aria-hidden="true">•••••</div></section>
<p class="helper" id="helper">按 A 開啟選單，再按 B 確認。<br>鍵盤 A / B / C 或 J / K / L 都可以。</p>
<footer><span>像素貓咪 · 本機自動存檔</span><span>v0.2</span></footer>
</main><script type="module" src="/app.js"></script></body></html>
