<!doctype html>
<html lang="zh-Hant" data-version="0.8.3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eee7dc">
  <title>didi · 口袋電子寵物</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
  <h1 class="sr-only">和 didi 的小日子</h1>
  <section class="device" aria-label="didi 電子寵物">
    <img class="device-shell-art" src="/public/assets/pokegotchi-shell.png" alt="" aria-hidden="true">
    <div class="brand">didi</div>
    <div class="bezel">
      <div class="screen" id="screen">
        <div class="screen-top">
          <div class="top-line"><span id="pet-age">幼年</span><span id="clock">--:--</span></div>
          <div class="bond-line"><span>關係</span><span id="bond-hearts" role="img" aria-label="關係度 0 / 100"></span><span id="bond-value">0/100</span></div>
        </div>
        <div class="scene" id="room-scene" data-action="idle" data-phase="idle">
          <img class="room-art" src="/public/assets/momo-room.png" alt="didi 的像素房間">
          <div class="pet-visual" id="pet-visual">
            <div id="pet-atlas" role="img" aria-label="didi 陪著你"></div>
          </div>
        </div>
        <div class="growth-celebration" id="growth-celebration" role="alert" hidden>
          <span class="growth-sparkle" aria-hidden="true">✦</span><span class="growth-sparkle" aria-hidden="true">✧</span><span class="growth-sparkle" aria-hidden="true">✦</span>
          <strong>didi 長大了！</strong>
          <span id="growth-path">幼年 → 成長中</span>
        </div>
        <div class="screen-status" id="screen-message" role="status" aria-live="polite">A 選擇 · B 確認</div>
        <nav class="quick-actions" id="quick-actions" aria-label="三鍵選取功能列"><ul>
          <li class="quick-item is-selected" data-quick="feed" aria-current="true"><span class="pixel-icon" data-icon="food" aria-hidden="true"></span><span>餐食</span></li>
          <li class="quick-item" data-quick="clean"><span class="pixel-icon" data-icon="care" aria-hidden="true"></span><span>清潔</span></li>
          <li class="quick-item" data-quick="play"><span class="pixel-icon" data-icon="play" aria-hidden="true"></span><span>玩耍</span></li>
          <li class="quick-item" data-quick="pet"><span class="pixel-icon" data-icon="heart" aria-hidden="true"></span><span>摸摸</span></li>
          <li class="quick-item" data-quick="status"><span class="pixel-icon" data-icon="status" aria-hidden="true"></span><span>狀態</span></li>
          <li class="quick-item" data-quick="main"><span class="pixel-icon" data-icon="menu" aria-hidden="true"></span><span>選單</span></li>
        </ul></nav>
        <section id="device-menu" aria-label="完整操作選單" hidden>
          <div class="menu-heading">
            <span class="back-glyph" aria-hidden="true">‹</span>
            <strong id="menu-title"></strong>
            <span id="menu-count"></span>
          </div>
          <ul id="menu-items" aria-label="選擇功能"></ul>
          <div id="detail-content"></div>
          <div class="screen-hint" id="menu-hint">A 選擇　B 確認　C 返回</div>
        </section>
      </div>
    </div>
    <div class="device-model">COLOR · 240</div>
    <section class="controls" aria-label="電子寵物三鍵操作">
      <div><button type="button" data-control="a" aria-label="A 選擇下一項">A</button><span>選擇</span></div>
      <div><button type="button" data-control="b" aria-label="B 確認">B</button><span>確認</span></div>
      <div><button type="button" data-control="c" aria-label="C 返回">C</button><span>返回</span></div>
    </section>
    <div class="speaker" aria-hidden="true">•••••</div>
  </section>
  <!-- Only the device is shown; instructions stay available to screen readers. -->
  <p class="helper sr-only" id="helper">螢幕不支援觸控。A 選功能、B 確認、C 返回。也可以使用鍵盤 A / B / C 或 J / K / L。</p>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
