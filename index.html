<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5c46d" />
    <title>塔麻過幾 · Pocket Pet</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar"><div><span class="eyebrow">POCKET PET / 01</span><h1>塔麻過幾 <em>PLAY LAB</em></h1></div><div class="top-meta"><span id="clock">--:--</span><span class="save-dot" aria-label="已儲存"></span></div></header>
      <section class="stage" aria-label="寵物畫面">
        <div class="stage-top"><span><b id="pet-age">DAY 01</b><i>·</i> MOMO'S ROOM</span><span>240 × 240 COLOR</span></div>
        <div class="scene" id="room-scene" aria-label="MOMO 的像素風房間場景">
          <img class="room-art" src="/public/assets/momo-room.png" alt="像素風房間，有床、食碗、毛線球、窗戶與盆栽" />
          <div class="pet-shadow"></div><img id="pet-sprite" class="pixel-pet" src="/public/assets/momo-cat-pixel.png" alt="MOMO：黑白花色、黃綠眼睛的像素貓" />
          <div class="mood-bubble" id="mood-face">✦</div>
        </div>
        <div class="status-row"><div><span class="status-label">HUNGER</span><div class="meter"><i id="hunger-meter"></i></div></div><strong id="hunger-value">78</strong><div><span class="status-label">JOY</span><div class="meter"><i id="joy-meter"></i></div></div><strong id="joy-value">72</strong></div>
        <div class="device-menu" id="device-menu" aria-live="polite"><span class="menu-state">READY</span><strong id="menu-display">A 開啟行動選單</strong><small id="menu-hint">B 選擇 · C 返回</small></div>
      </section>
      <section class="info-line"><div class="mood-lockup"><span class="eyebrow">CURRENT MOOD</span><div><span class="mood-dot"></span><strong id="mood-label">GLOWING</strong></div></div><div class="coins"><span>◈</span><strong id="coins">12</strong><small>COINS</small></div></section>
      <section class="controls" aria-label="電子雞三鍵操作"><button data-control="a"><span class="key">A</span><span><b>MENU / NEXT</b><small>開啟／瀏覽行動</small></span></button><button data-control="b"><span class="key">B</span><span><b>SELECT</b><small>確認行動</small></span></button><button data-control="c"><span class="key">C</span><span><b>BACK</b><small>返回待機</small></span></button></section>
      <p class="helper" id="helper">用 A/B/C 按鍵選行動；房間是場景，不需點擊。</p>
      <footer><span>v0.1 MVP · cloud-ready</span><button id="reset" class="text-button">重置存檔</button></footer>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
