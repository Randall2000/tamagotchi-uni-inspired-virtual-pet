<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eee7dc">
  <title>MOMO · 口袋電子寵物</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
  <header>
    <span class="eyebrow">POCKET COMPANION</span>
    <h1>和 MOMO 的小日子</h1>
    <p>三顆按鍵，一起慢慢生活。</p>
  </header>
  <section class="device" aria-label="MOMO 電子寵物">
    <div class="brand">MOMO <span>•</span> POCKET PET</div>
    <div class="bezel">
      <div class="screen" id="screen">
        <div class="screen-top">
          <span id="pet-age">第 1 天</span>
          <span id="clock">--:--</span>
          <button id="open-menu" class="top-menu-btn" type="button" aria-label="開啟完整選單" title="完整選單">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
        <div class="scene" id="room-scene" data-action="idle" data-phase="idle">
          <img class="room-art" src="/public/assets/momo-room.png" alt="MOMO 的像素房間">
          <div class="pet-visual" id="pet-visual">
            <img id="pet-sprite" class="pixel-pet" src="/public/assets/momo-cat-pixel.png" alt="MOMO 坐著待機">
            <div id="pet-atlas" role="img" hidden></div>
          </div>
          <div class="action-effects" id="action-effects" data-effect="none" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <span id="pose-caption" class="pose-caption">陪著你</span>
        </div>
        <div class="screen-toast" id="screen-message" role="status" aria-live="polite" hidden></div>
        <nav class="quick-actions" id="quick-actions" aria-label="快速照顧選單">
          <ul>
            <li><button type="button" data-quick="feed" aria-label="直接餵食">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16l-2 7H6l-2-7ZM7 9l3-4m3 4 3-4"/></svg><span>餵食</span></button></li>
            <li><button type="button" data-quick="play" aria-label="直接玩耍">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2L12 3Z"/></svg><span>玩耍</span></button></li>
            <li><button type="button" data-quick="clean" aria-label="直接清潔">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3 4-6 7.2-6 11a6 6 0 0 0 12 0c0-3.8-3-7-6-11Zm-3 12a3.5 3.5 0 0 0 3 3"/></svg><span>清潔</span></button></li>
            <li><button type="button" data-quick="rest" aria-label="讓寵物睡覺或喚醒">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8 8 0 0 1 8.7 4 8 8 0 1 0 20 15.3Z"/></svg><span id="rest-label">睡覺</span></button></li>
            <li><button type="button" data-quick="status" aria-label="查看寵物狀態">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9m7 10V5m7 14v-7M3 20h18"/></svg><span>狀態</span></button></li>
          </ul>
        </nav>
        <section id="device-menu" aria-label="完整操作選單" hidden>
          <div class="menu-heading">
            <button type="button" class="back-button" id="menu-back" aria-label="返回上一層">‹</button>
            <strong id="menu-title"></strong>
            <span id="menu-count"></span>
          </div>
          <ul id="menu-items" aria-label="選擇功能"></ul>
          <div id="detail-content"></div>
          <div class="screen-hint">A 選擇　B 確認　C 返回</div>
        </section>
      </div>
    </div>
    <div class="device-model">COLOR · 240</div>
    <section class="controls" aria-label="電子寵物三鍵操作">
      <div><button type="button" data-control="a" aria-label="A 選擇下一項">A</button><span>選擇</span></div>
      <div><button type="button" data-control="b" aria-label="B 確認">B</button><span>確認</span></div>
      <div><button type="button" data-control="c" aria-label="C 返回">C</button><span>返回</span></div>
    </section>
    <div class="speaker" aria-hidden="true">•••••</div>
  </section>
  <p class="helper" id="helper">點螢幕下方的功能即可直接互動。<br>也可以使用 A / B / C 三鍵，或鍵盤 J / K / L。</p>
  <footer><span>像素貓咪 · 本機自動存檔</span><span>v0.3</span></footer>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
